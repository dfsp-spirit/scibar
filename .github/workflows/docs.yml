name: Docs

on:
  push:
    branches: [main, master]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Doxygen
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
          # Ubuntu's doxygen package is 1.9.x, which has a bug that escapes inline
          # code in Markdown headings as literal <tt> text (doxygen issue #10466,
          # fixed in 1.10.0). Install a newer official binary instead.
          curl -sL -o /tmp/doxygen.tar.gz \
            https://github.com/doxygen/doxygen/releases/download/Release_1_13_2/doxygen-1.13.2.linux.bin.tar.gz
          tar xzf /tmp/doxygen.tar.gz -C /tmp
          echo "/tmp/doxygen-1.13.2/bin" >> "$GITHUB_PATH"

      - name: Generate C++ API docs
        run: doxygen Doxyfile

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/api/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
